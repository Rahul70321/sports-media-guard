version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-sports-media-assets-mvp}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - AUTHORIZED_FEED_ALLOWLIST=${AUTHORIZED_FEED_ALLOWLIST:-}
      - WEBHOOK_ALLOWLIST=${WEBHOOK_ALLOWLIST:-}
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/downloads:/app/downloads

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - AUTHORIZED_FEED_ALLOWLIST=${AUTHORIZED_FEED_ALLOWLIST:-}
      - WEBHOOK_ALLOWLIST=${WEBHOOK_ALLOWLIST:-}
    depends_on:
      - db

  scheduler:
    build:
      context: ./backend
    command: ["python", "scheduler.py"]
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - AUTHORIZED_FEED_ALLOWLIST=${AUTHORIZED_FEED_ALLOWLIST:-}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sports_media
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
