services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/downloads:/app/downloads

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - AUTHORIZED_FEED_ALLOWLIST=${AUTHORIZED_FEED_ALLOWLIST:-}
      - WEBHOOK_ALLOWLIST=${WEBHOOK_ALLOWLIST:-}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    command: ["python", "scheduler.py"]
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/sports_media
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - AUTHORIZED_FEED_ALLOWLIST=${AUTHORIZED_FEED_ALLOWLIST:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sports_media
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_media"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
